<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPO Trade Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4AF37;
    --gold2: #FFD700;
    --bg: #0a0a12;
    --bg2: #0f0f1e;
    --bg3: #13132a;
    --panel: #0d0d20;
    --border: #2a2a4a;
    --text: #e0e0f0;
    --muted: #7070a0;
    --green: #00e676;
    --red: #ff4444;
    --blue: #4fc3f7;
    --purple: #ce93d8;
    --ss: #D4AF37;
    --s: #C0C0C0;
    --aplus: #00BFFF;
    --a: #FF6B35;
    --aminus: #7CFC00;
    --bplus: #FFA500;
    --b: #FFD700;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(212,175,55,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(79,195,247,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(212,175,55,0.08) 0%, transparent 100%);
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #D4AF37, #FFD700, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ===== NAV TABS ===== */
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 20px 0;
    position: relative;
    z-index: 10;
  }

  .nav-tab {
    padding: 8px 24px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }

  .nav-tab:hover { border-color: var(--gold); color: var(--gold); }
  .nav-tab.active {
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ===== PAGES ===== */
  .page { display: none; padding: 20px; position: relative; z-index: 1; }
  .page.active { display: block; }

  /* ===== TRADE SIMULATOR ===== */
  .trade-arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .trade-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .trade-panel-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .panel-my .trade-panel-header { background: linear-gradient(90deg, rgba(0,230,118,0.1), transparent); }
  .panel-other .trade-panel-header { background: linear-gradient(270deg, rgba(255,68,68,0.1), transparent); }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .panel-my .panel-title { color: var(--green); }
  .panel-other .panel-title { color: var(--red); }

  .panel-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .panel-value span { color: var(--gold); font-size: 15px; }

  .items-in-trade {
    min-height: 180px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }

  .trade-item-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 500;
    animation: chipIn 0.15s ease;
    max-width: 100%;
  }

  @keyframes chipIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .trade-item-chip .item-tier-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  .trade-item-chip .item-name { flex: 1; font-size: 12px; }
  .trade-item-chip .item-val { color: var(--gold); font-size: 11px; margin-left: 4px; }

  .trade-item-chip .remove-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; padding: 0 2px;
    line-height: 1; transition: color 0.15s;
  }
  .trade-item-chip .remove-btn:hover { color: var(--red); }

  .trade-item-chip .qty-ctrl {
    display: flex; align-items: center; gap: 4px;
  }
  .qty-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    width: 18px; height: 18px; font-size: 12px; cursor: pointer; border-radius: 2px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s;
  }
  .qty-btn:hover { border-color: var(--gold); color: var(--gold); }
  .qty-display { font-size: 12px; color: var(--gold); min-width: 16px; text-align: center; }

  .add-item-area {
    border-top: 1px solid var(--border);
    padding: 12px;
  }

  .add-btn {
    width: 100%;
    padding: 10px;
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 3px;
  }
  .panel-my .add-btn:hover { border-color: var(--green); color: var(--green); }
  .panel-other .add-btn:hover { border-color: var(--red); color: var(--red); }

  /* Center verdict */
  .trade-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 140px;
  }

  .vs-badge {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    width: 50px; height: 50px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(212,175,55,0.08);
  }

  .verdict-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 12px;
    text-align: center;
    min-width: 130px;
  }

  .verdict-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .verdict-result {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .verdict-result.win { color: var(--green); }
  .verdict-result.lose { color: var(--red); }
  .verdict-result.even { color: var(--gold); }
  .verdict-result.neutral { color: var(--muted); }

  .verdict-diff {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .reset-btn {
    padding: 8px 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* ===== ITEM PICKER MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 560px;
    max-width: 95vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.05);
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.95) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(212,175,55,0.06), transparent);
  }

  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .modal-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; transition: color 0.15s;
  }
  .modal-close:hover { color: var(--red); }

  .modal-search {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--muted); }

  .tier-filters {
    display: flex;
    gap: 4px;
    padding: 8px 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .tier-filter-btn {
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
  }
  .tier-filter-btn.active, .tier-filter-btn:hover {
    border-color: currentColor;
  }
  .tier-filter-btn[data-tier="ALL"] { color: var(--text); }
  .tier-filter-btn[data-tier="SS"] { color: var(--ss); }
  .tier-filter-btn[data-tier="S"] { color: var(--s); }
  .tier-filter-btn[data-tier="A+"] { color: var(--aplus); }
  .tier-filter-btn[data-tier="A"] { color: var(--a); }
  .tier-filter-btn[data-tier="A-"] { color: var(--aminus); }
  .tier-filter-btn[data-tier="B+"] { color: var(--bplus); }
  .tier-filter-btn[data-tier="B"] { color: var(--b); }

  .items-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }

  .items-list::-webkit-scrollbar { width: 4px; }
  .items-list::-webkit-scrollbar-track { background: var(--bg); }
  .items-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .item-row:hover {
    background: var(--bg3);
    border-color: var(--border);
  }

  .item-row-tier {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    min-width: 28px;
    text-align: center;
    padding: 2px 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.05);
  }

  .item-row-name { flex: 1; font-size: 13px; font-weight: 500; }

  .item-row-price {
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
  }
  .item-row-price.unknown { color: var(--muted); font-style: italic; }

  .tier-group-header {
    padding: 6px 12px;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ===== PRICE EDITOR ===== */
  .price-editor {
    max-width: 900px;
    margin: 0 auto;
  }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: gap;
    gap: 12px;
  }

  .editor-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--gold);
  }

  .editor-search {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 3px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    outline: none;
    width: 240px;
    transition: border-color 0.2s;
  }
  .editor-search:focus { border-color: var(--gold); }
  .editor-search::placeholder { color: var(--muted); }

  .editor-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .editor-table th {
    padding: 10px 14px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    position: sticky;
    top: 0;
  }

  .editor-table td {
    padding: 7px 14px;
    border-bottom: 1px solid rgba(42,42,74,0.5);
    vertical-align: middle;
  }

  .editor-table tr:hover td { background: rgba(212,175,55,0.03); }

  .price-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 2px;
    width: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  .price-input:focus { border-color: var(--gold); }

  .save-prices-btn {
    padding: 10px 28px;
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.08));
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    text-transform: uppercase;
  }
  .save-prices-btn:hover {
    background: linear-gradient(135deg, rgba(212,175,55,0.35), rgba(212,175,55,0.15));
    box-shadow: 0 0 16px rgba(212,175,55,0.2);
  }

  .import-export-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .secondary-btn {
    padding: 7px 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .secondary-btn:hover { border-color: var(--gold); color: var(--gold); }

  .saved-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    border-radius: 3px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .saved-toast.show { opacity: 1; transform: translateY(0); }

  /* ===== TIER COLORS in table ===== */
  .tc-SS { color: var(--ss); }
  .tc-S  { color: var(--s); }
  .tc-Aplus { color: var(--aplus); }
  .tc-A  { color: var(--a); }
  .tc-Aminus { color: var(--aminus); }
  .tc-Bplus { color: var(--bplus); }
  .tc-B  { color: var(--b); }

  .dot-SS { background: var(--ss); }
  .dot-S  { background: var(--s); }
  .dot-Aplus { background: var(--aplus); }
  .dot-A  { background: var(--a); }
  .dot-Aminus { background: var(--aminus); }
  .dot-Bplus { background: var(--bplus); }
  .dot-B  { background: var(--b); }

  /* Responsive */
  @media (max-width: 700px) {
    .trade-arena { grid-template-columns: 1fr; }
    .trade-center { flex-direction: row; justify-content: center; }
    .vs-badge { width: 40px; height: 40px; font-size: 16px; }
  }

  .empty-state {
    color: var(--muted);
    font-size: 12px;
    padding: 20px;
    text-align: center;
    letter-spacing: 1px;
    width: 100%;
  }

  .subtier-badge {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 1px 4px;
    border: 1px solid var(--border);
    border-radius: 2px;
    text-transform: uppercase;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>


<style>
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;color:var(--muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background 0.3s;}
.sync-dot.ok{background:#00e676;box-shadow:0 0 6px #00e676;}
.sync-dot.loading{background:#D4AF37;animation:syncpulse 1s infinite;}
.sync-dot.error{background:#ff4444;}
@keyframes syncpulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.chart-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:14px;}
.chart-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.chart-card-name{font-size:13px;font-weight:600;}
.chart-card-sub{font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;background:rgba(255,255,255,0.06);}
.chart-card-price{font-size:11px;color:var(--muted);margin-top:2px;}
.chart-canvas-wrap{position:relative;height:110px;}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
</style>

</head>
<body>

<header>
  <div class="logo">⚔ GPO TRADE SIMULATOR ⚔</div>
  <div class="subtitle">Grand Piece Online · Value Calculator</div>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="showPage('trade')">◆ Simulator</button>
  <button class="nav-tab" onclick="showPage('prices')">◆ Edit Prices</button>
</div>

<!-- ===== TRADE PAGE ===== -->
<div class="page active" id="page-trade">
  <div class="trade-arena">

    <!-- MY OFFER -->
    <div class="trade-panel panel-my">
      <div class="trade-panel-header">
        <div class="panel-title">⚡ My Offer</div>
        <div class="panel-value">Total: <span id="my-total">0</span> MC</div>
      </div>
      <div class="items-in-trade" id="my-items">
        <div class="empty-state" id="my-empty">No items added</div>
      </div>
      <div class="add-item-area">
        <button class="add-btn" onclick="openModal('my')">+ ADD ITEM</button>
      </div>
    </div>

    <!-- CENTER -->
    <div class="trade-center">
      <div class="vs-badge">VS</div>
      <div class="verdict-box">
        <div class="verdict-label">Verdict</div>
        <div class="verdict-result neutral" id="verdict-result">—</div>
        <div class="verdict-diff" id="verdict-diff">Add items</div>
      </div>
      <button class="reset-btn" onclick="resetTrade()">✕ RESET</button>
    </div>

    <!-- OTHER OFFER -->
    <div class="trade-panel panel-other">
      <div class="trade-panel-header">
        <div class="panel-title">🎯 Other Offer</div>
        <div class="panel-value">Total: <span id="other-total">0</span> MC</div>
      </div>
      <div class="items-in-trade" id="other-items">
        <div class="empty-state" id="other-empty">No items added</div>
      </div>
      <div class="add-item-area">
        <button class="add-btn" onclick="openModal('other')">+ ADD ITEM</button>
      </div>
    </div>

  </div>
</div>

<!-- ===== PRICES PAGE ===== -->
<div class="page" id="page-prices">
  <div class="price-editor">
    <div class="editor-header">
      <div class="editor-title">⚙ Price Editor</div>
      <input class="editor-search" type="text" placeholder="🔍 Search item..." oninput="filterEditor(this.value)">
    </div>
    <div class="import-export-row">

async function sbFetch(path, options) {
  options = options || {};
  const res = await fetch(SUPABASE_URL + path, {
    method: options.method || 'GET',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || (options.method === 'POST' ? 'resolution=merge-duplicates' : '')
    },
    body: options.body || undefined
  });
  if (res.status === 204) return null;
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.json();
}

      ITEMS_DB.forEach(function(item) {

// Load history from Supabase
async function loadHistoryFromSupabase() {
  try {
    const data = await sbFetch('/rest/v1/price_history?select=item_key,price,recorded_at&order=recorded_at.asc');
    const history = {};
    if (data) {
      data.forEach(function(row) {
        if (!history[row.item_key]) history[row.item_key] = [];
        const d = new Date(row.recorded_at);
        const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'2-digit'});
        history[row.item_key].push({ date: dateStr, price: row.price });
      });
    }

  } catch(e) { return {}; }
}

function importPrices(e) {

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const map = JSON.parse(ev.target.result);
      ITEMS_DB.forEach(item => {
        const key = item.tier+'|'+item.name;
        if (map[key] !== undefined) item.price = map[key];
      });
      localStorage.setItem('gpo_prices', JSON.stringify(map));
      buildEditorTable('');
      updateTrade();
      showToast('✓ Prices imported!');
    } catch(err) { alert('Invalid JSON file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ========================
function getItemValue(item) {
  const found = ITEMS_DB.find(i => i.name === item.name);
  return found && found.price !== null ? found.price * item.qty : null;
}

function calcTotal(list) {
  let total = 0, hasUnknown = false;
  list.forEach(item => {
    const v = getItemValue(item);
    if (v === null) hasUnknown = true;
    else total += v;
  });
  return { total, hasUnknown };
}

function updateTrade() {
  const myR = calcTotal(myItems);
  const otherR = calcTotal(otherItems);

  document.getElementById('my-total').textContent =
    myR.hasUnknown ? myR.total + '+?' : myR.total.toFixed(1);
  document.getElementById('other-total').textContent =
    otherR.hasUnknown ? otherR.total + '+?' : otherR.total.toFixed(1);

  const vr = document.getElementById('verdict-result');
  const vd = document.getElementById('verdict-diff');

  if (myItems.length === 0 && otherItems.length === 0) {
    vr.textContent = '—'; vr.className = 'verdict-result neutral';
    vd.textContent = 'Add items'; return;
  }

  const diff = otherR.total - myR.total;
  const absDiff = Math.abs(diff).toFixed(1);

  if (myR.hasUnknown || otherR.hasUnknown) {
    vr.textContent = '?'; vr.className = 'verdict-result neutral';
    vd.textContent = 'Unknown prices'; return;
  }

  if (diff > 0.05) {
    vr.textContent = '✓ PROFIT'; vr.className = 'verdict-result win';
    vd.textContent = '+' + absDiff + ' MC';
  } else if (diff < -0.05) {
    vr.textContent = '✗ LOSS'; vr.className = 'verdict-result lose';
    vd.textContent = '−' + absDiff + ' MC';
  } else {
    vr.textContent = '= EVEN'; vr.className = 'verdict-result even';
    vd.textContent = 'Fair trade';
  }
}

function renderItems(side) {
  const list = side === 'my' ? myItems : otherItems;
  const container = document.getElementById(side + '-items');
  const empty = document.getElementById(side + '-empty');

  const chips = container.querySelectorAll('.trade-item-chip');
  chips.forEach(c => c.remove());

  if (list.length === 0) {
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    list.forEach((item, idx) => {
      const dbItem = ITEMS_DB.find(i => i.name === item.name);
      const val = dbItem && dbItem.price !== null ? (dbItem.price * item.qty).toFixed(1) + ' MC' : '?';
      const chip = document.createElement('div');
      chip.className = 'trade-item-chip';
      chip.innerHTML = `
        <div class="item-tier-dot ${TIER_DOT[item.tier] || ''}"></div>
        <span class="item-name">${item.name}</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${side}',${idx},-1)">−</button>
          <span class="qty-display">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${side}',${idx},1)">+</button>
        </div>
        <span class="item-val">${val}</span>
        <button class="remove-btn" onclick="removeItem('${side}',${idx})">✕</button>
      `;
      container.appendChild(chip);
    });
  }
  updateTrade();
}

function changeQty(side, idx, delta) {
  const list = side === 'my' ? myItems : otherItems;
  list[idx].qty = Math.max(1, list[idx].qty + delta);
  renderItems(side);
}

function removeItem(side, idx) {
  const list = side === 'my' ? myItems : otherItems;
  list.splice(idx, 1);
  renderItems(side);
}

function resetTrade() {
  myItems = []; otherItems = [];
  renderItems('my'); renderItems('other');
}

  currentTierFilter = tier;
  document.querySelectorAll('.tier-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildItemsList(document.getElementById('modal-search').value);
}

function buildItemsList(query) {
  const container = document.getElementById('items-list');
  container.innerHTML = '';
  const q = query.toLowerCase().trim();

  const tiers = ["SS","S","A+","A","A-","B+","B"];
  tiers.forEach(tier => {
    if (currentTierFilter !== 'ALL' && currentTierFilter !== tier) return;
    const items = ITEMS_DB.filter(item =>
      item.tier === tier &&
      (q === '' || item.name.toLowerCase().includes(q))
    );
    if (items.length === 0) return;

    const header = document.createElement('div');
    header.className = 'tier-group-header ' + TIER_TEXT[tier];
    header.textContent = 'Tier ' + tier;
    container.appendChild(header);

    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      const priceText = item.price !== null
        ? item.price.toFixed(1) + ' MC'
        : 'No price';
      row.innerHTML = `
        <span class="item-row-tier ${TIER_TEXT[tier]}">${item.tier}</span>
        <span class="item-row-name">${item.name}</span>
        <span class="subtier-badge">${item.sub}</span>
        <span class="item-row-price ${item.price === null ? 'unknown' : ''}">${priceText}</span>
      `;
      row.onclick = () => addItemToTrade(item);
      container.appendChild(row);
    });
  });

  if (container.children.length === 0) {
    container.innerHTML = '<div class="empty-state">No items found</div>';
  }
}

function addItemToTrade(item) {
  const list = currentTarget === 'my' ? myItems : otherItems;
  const existing = list.find(i => i.name === item.name);
  if (existing) { existing.qty++; }
  else { list.push({ name: item.name, tier: item.tier, qty: 1 }); }
  renderItems(currentTarget);
  closeModal();
}

// PRICE EDITOR
// ========================
function buildEditorTable(query) {
  const tbody = document.getElementById('editor-body');
  tbody.innerHTML = '';
  const q = query.toLowerCase().trim();

  ITEMS_DB.forEach(item => {
    if (q && !item.name.toLowerCase().includes(q)) return;
    const key = item.tier + '|' + item.name;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${TIER_TEXT[item.tier]}" style="font-weight:700;font-size:13px">${item.tier}</td>
      <td style="color:var(--muted);font-size:11px">${item.sub}</td>
      <td>${item.name}</td>
      <td>
        <input class="price-input" type="number" min="0" step="0.5"
          data-key="${key}"
          value="${item.price !== null ? item.price : ''}"
          placeholder="?">
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function filterEditor(query) { buildEditorTable(query); }

// ========================
// NAV
// ========================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}
